<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennistraining - Teilnehmer & Verpflegung</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 15px; background-color: #f4f4f9; color: #333; }
        h2 { color: #075e54; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #128c7e; color: white; }
        .name-cell { font-weight: bold; background-color: #f9f9f9; width: 35%; }
        select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        .stats-box {
            background: white; border: 1px solid #ddd; border-radius: 8px;
            padding: 10px; margin-bottom: 15px; display: flex;
            justify-content: space-around; text-align: center;
        }
        .stat-number { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .komme { color: #2e7d32; }
        .nur-essen { color: #e65100; }
        .absage { color: #c62828; }
        .offen { color: #757575; }

        .btn-whatsapp { 
            background-color: #25D366; color: white; padding: 14px 20px; 
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; 
            cursor: pointer; width: 100%; display: block; text-align: center;
        }
    </style>
</head>
<body>

    <h2>🎾 Tennistraining</h2>

    <div class="stats-box">
        <div class="stat-item">
            <div>🎾 Dabei</div>
            <div id="count-komme" class="stat-number komme">0</div>
        </div>
        <div class="stat-item">
            <div>🍽️ Essen</div>
            <div id="count-nur-essen" class="stat-number nur-essen">0</div>
        </div>
        <div class="stat-item">
            <div>🔴 Neins</div>
            <div id="count-absage" class="stat-number absage">0</div>
        </div>
        <div class="stat-item">
            <div>⏳ Offen</div>
            <div id="count-offen" class="stat-number offen">12</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Mitbringen</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <button class="btn-whatsapp" onclick="sendToWhatsApp()">📱 Per WhatsApp senden</button>

    <script>
        const personen = [
            "Reinhard G.", "Klaus", "Ulrich", "Günter", 
            "Werner S.", "Gustav", "Jürgen", "Steffen", 
            "Reinhard K.", "Werner W.", "Thomas", "Rolf"
        ];

        const mitbringselOptionen = [
            "Nichts", "Fleisch", "Wurst", "Brot", 
            "Senf", "Holzkohle", "Anzünder", "Schnaps"
        ];

        document.addEventListener("DOMContentLoaded", function() {
            const tbody = document.getElementById('table-body');
            let mitbringselHtml = mitbringselOptionen.map(item => `<option value="${item}">${item}</option>`).join('');

            personen.forEach((name) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="name-cell">${name}</td>
                    <td>
                        <select class="status" onchange="updateStats()">
                            <option value="Offen">Offen</option>
                            <option value="Komme">🟢 Trainiere</option>
                            <option value="Nur Essen">🍽️ Nur Essen</option>
                            <option value="Komme nicht">🔴 Absage</option>
                        </select>
                    </td>
                    <td>
                        <select class="mitbringsel">
                            ${mitbringselHtml}
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateStats();
        });

        function updateStats() {
            let statuses = document.querySelectorAll('.status');
            let counts = { Komme: 0, "Nur Essen": 0, "Komme nicht": 0, Offen: 0 };

            statuses.forEach(s => {
                if (counts.hasOwnProperty(s.value)) {
                    counts[s.value]++;
                }
            });

            document.getElementById('count-komme').innerText = counts["Komme"];
            document.getElementById('count-nur-essen').innerText = counts["Nur Essen"];
            document.getElementById('count-absage').innerText = counts["Komme nicht"];
            document.getElementById('count-offen').innerText = counts["Offen"];

            return counts;
        }

        function sendToWhatsApp() {
            let counts = updateStats();
            let text = "🎾 *TENNISTRAINING & VERPFLEGUNG*\n\n";
            
            text += "📊 *TRAININGS-CHECK:* (Gesamt: " + personen.length + ")\n";
            text += "🎾 Trainieren mit: " + counts["Komme"] + "\n";
            text += "🍽️ Nur Essen: " + counts["Nur Essen"] + "\n";
            text += "🔴 Absagen: " + counts["Komme nicht"] + "\n";
            text += "⏳ Noch offen: " + counts["Offen"] + "\n\n";
            text += "-----------------------------------\n\n";

            let statuses = document.querySelectorAll('.status');
            let items = document.querySelectorAll('.mitbringsel');

            let komme = [];
            let nurEssen = [];
            let absage = [];
            let mitbringsel = [];

            personen.forEach((name, i) => {
                let status = statuses[i].value;
                let item = items[i].value;

                if (status === "Komme") komme.push(name);
                if (status === "Nur Essen") nurEssen.push(name);
                if (status === "Komme nicht") absage.push(name);

                if (item !== "Nichts") {
                    mitbringsel.push("• *" + name + "*: " + item);
                }
            });

            text += "🎾 *Beim Training dabei:*\n" + (komme.length ? komme.join("\n") : "Keiner") + "\n\n";
            text += "🍽️ *Dabei nur zum Essen:*\n" + (nurEssen.length ? nurEssen.join("\n") : "Keiner") + "\n\n";
            text += "🔴 *Absagen:*\n" + (absage.length ? absage.join("\n") : "Keine") + "\n\n";
            text += "🥗 *Wer bringt was mit:*\n" + (mitbringsel.length ? mitbringsel.join("\n") : "Noch nichts eingetragen");

            let url = "https://wa.me/?text=" + encodeURIComponent(text);
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
