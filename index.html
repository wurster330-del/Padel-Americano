<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Padel & Team Score Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Tailwind Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-between overflow-hidden selection:bg-brand-500 selection:text-white">

    <!-- Header -->
    <header class="w-full px-4 py-3 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-brand-500 animate-pulse"></div>
            <h1 class="text-sm font-bold tracking-wider uppercase text-slate-300">Padel Counter <span class="text-brand-500 font-extrabold">31</span></h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Undo Button -->
            <button id="undo-btn" onclick="undoScore()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold rounded-lg text-slate-300 transition flex items-center space-x-1 border border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                <span>Undo</span>
            </button>
            <!-- Reset Button -->
            <button onclick="openResetModal()" class="px-3 py-1.5 bg-rose-950/60 hover:bg-rose-900/60 active:scale-95 text-xs font-semibold rounded-lg text-rose-300 transition flex items-center space-x-1 border border-rose-900/50">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                <span>Reset</span>
            </button>
        </div>
    </header>

    <!-- Main Score Container (Optimized for both mobile & watch ratios) -->
    <main class="flex-1 flex flex-col p-3 max-w-md mx-auto w-full justify-between gap-3">
        
        <!-- Combined Total Status Bar -->
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 text-center shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800">
                <div id="progress-bar" class="h-full bg-brand-500 transition-all duration-300" style="width: 0%;"></div>
            </div>
            <div class="text-xs uppercase font-semibold text-slate-400 tracking-wider">Combined Total Score</div>
            <div class="flex items-center justify-center space-x-2 mt-1">
                <span id="total-score" class="text-3xl font-extrabold text-white tracking-tight">0</span>
                <span class="text-slate-500 text-lg font-bold">/ 31</span>
            </div>
            <div id="status-message" class="text-[11px] text-brand-400 font-medium mt-0.5">Game in progress...</div>
        </div>

        <!-- Team Buttons Container (Split Screen / Big Touch Zones) -->
        <div class="flex-1 grid grid-rows-2 gap-3 min-h-0">
            
            <!-- Team A Box -->
            <button onclick="addPoint('A')" class="group relative bg-gradient-to-br from-blue-900/40 to-slate-900 border-2 border-blue-500/30 hover:border-blue-500/60 rounded-3xl p-4 flex flex-col justify-between items-center transition-all active:scale-[0.98] shadow-xl overflow-hidden cursor-pointer">
                <div class="w-full flex justify-between items-center">
                    <span class="text-xs uppercase font-extrabold tracking-wider text-blue-400 bg-blue-950/80 px-2.5 py-1 rounded-full border border-blue-800/50">Team A</span>
                    <span class="text-xs text-slate-400 font-medium">Tap to +1</span>
                </div>
                <div class="my-auto">
                    <span id="score-a" class="text-6xl font-black text-white tracking-tight group-hover:scale-105 transition-transform inline-block">0</span>
                </div>
                <div class="w-full text-center text-[10px] text-blue-300/70 font-medium tracking-wide uppercase">
                    Click anywhere to score
                </div>
            </button>

            <!-- Team B Box -->
            <button onclick="addPoint('B')" class="group relative bg-gradient-to-br from-emerald-900/40 to-slate-900 border-2 border-emerald-500/30 hover:border-emerald-500/60 rounded-3xl p-4 flex flex-col justify-between items-center transition-all active:scale-[0.98] shadow-xl overflow-hidden cursor-pointer">
                <div class="w-full flex justify-between items-center">
                    <span class="text-xs uppercase font-extrabold tracking-wider text-emerald-400 bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-800/50">Team B</span>
                    <span class="text-xs text-slate-400 font-medium">Tap to +1</span>
                </div>
                <div class="my-auto">
                    <span id="score-b" class="text-6xl font-black text-white tracking-tight group-hover:scale-105 transition-transform inline-block">0</span>
                </div>
                <div class="w-full text-center text-[10px] text-emerald-300/70 font-medium tracking-wide uppercase">
                    Click anywhere to score
                </div>
            </button>

        </div>
    </main>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="w-16 h-16 bg-brand-500/20 text-brand-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-brand-500/30 animate-bounce">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h2 class="text-xl font-extrabold text-white mb-1">Game Over!</h2>
            <p class="text-xs text-slate-400 mb-4">Total target of 31 points reached.</p>
            
            <div id="winner-announcement" class="text-lg font-bold text-brand-400 bg-slate-950/60 p-3 rounded-2xl border border-slate-800 mb-6">
                Winner: Team A!
            </div>

            <div class="flex space-x-3">
                <button onclick="closeGameOverModal()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-bold rounded-xl text-slate-300 transition border border-slate-700">
                    View Scoreboard
                </button>
                <button onclick="resetGame(); closeGameOverModal();" class="flex-1 py-3 bg-brand-600 hover:bg-brand-500 active:scale-95 text-xs font-bold rounded-xl text-white transition shadow-lg shadow-brand-600/30">
                    New Match
                </button>
            </div>
        </div>
    </div>

    <!-- Reset Confirmation Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h3 class="text-base font-bold text-white mb-2">Reset Match?</h3>
            <p class="text-xs text-slate-400 mb-5">All current points will be cleared back to zero.</p>
            <div class="flex space-x-2">
                <button onclick="closeResetModal()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300 border border-slate-700">
                    Cancel
                </button>
                <button onclick="resetGame(); closeResetModal();" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-500 text-xs font-semibold rounded-xl text-white">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        let scoreA = 0;
        let scoreB = 0;
        let historyStack = [];
        let isGameOver = false;

        const maxTotal = 31;

        function updateUI() {
            document.getElementById('score-a').innerText = scoreA;
            document.getElementById('score-b').innerText = scoreB;
            
            const total = scoreA + scoreB;
            document.getElementById('total-score').innerText = total;

            // Update Progress bar percentage
            const percentage = Math.min((total / maxTotal) * 100, 100);
            document.getElementById('progress-bar').style.width = percentage + '%';

            // Enable or disable Undo button
            document.getElementById('undo-btn').disabled = historyStack.length === 0;

            // Status updates
            const statusEl = document.getElementById('status-message');
            if (total >= maxTotal) {
                statusEl.innerText = "Target reached!";
                statusEl.className = "text-[11px] text-rose-400 font-bold mt-0.5";
            } else {
                statusEl.innerText = `${maxTotal - total} points remaining`;
                statusEl.className = "text-[11px] text-brand-400 font-medium mt-0.5";
            }
        }

        function addPoint(team) {
            if (isGameOver) return;

            // Push state for undo
            historyStack.push({ scoreA, scoreB });

            if (team === 'A') {
                scoreA++;
            } else if (team === 'B') {
                scoreB++;
            }

            updateUI();

            // Check if combined total reaches 31
            if ((scoreA + scoreB) >= maxTotal) {
                triggerGameOver();
            }
        }

        function undoScore() {
            if (historyStack.length === 0) return;

            const previousState = historyStack.pop();
            scoreA = previousState.scoreA;
            scoreB = previousState.scoreB;
            isGameOver = false;

            updateUI();
        }

        function resetGame() {
            scoreA = 0;
            scoreB = 0;
            historyStack = [];
            isGameOver = false;
            updateUI();
        }

        function triggerGameOver() {
            isGameOver = true;
            let winnerText = "";
            if (scoreA > scoreB) {
                winnertext = "🏆 Team A Wins!";
            } else if (scoreB > scoreA) {
                winnertext = "🏆 Team B Wins!";
            } else {
                winnertext = "🤝 It's a Tie Match!";
            }

            document.getElementById('winner-announcement').innerText = winnerText;
            
            // Show Game Over Modal
            const modal = document.getElementById('game-over-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('#modal-content').classList.remove('scale-95');
            modal.querySelector('#modal-content').classList.add('scale-100');
        }

        function closeGameOverModal() {
            const modal = document.getElementById('game-over-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('#modal-content').classList.remove('scale-100');
            modal.querySelector('#modal-content').classList.add('scale-95');
        }

        function openResetModal() {
            const modal = document.getElementById('reset-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeResetModal() {
            const modal = document.getElementById('reset-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Initialize state on load
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
