<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassensystem (POS)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout Container */
        .pos-container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: row;
        }

        /* Responsive Layout für Smartphones (z. B. iPhone 16 Pro) */
        @media (max-width: 768px) {
            .pos-container {
                flex-direction: column;
                overflow-y: auto;
            }
            body {
                height: auto;
                overflow: auto;
            }
        }

        /* Linke Seite: Produkte */
        .products-section {
            flex: 2;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #e0e0e0;
        }

        .products-section h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 110px;
        }

        .product-card:active {
            transform: scale(0.97);
            background-color: #eef2ff;
        }

        .product-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .product-price {
            color: #2563eb;
            font-weight: bold;
        }

        /* Rechte Seite: Warenkorb */
        .cart-section {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: -2px 0 10px rgba(0,0,0,0.03);
            min-width: 320px;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #f8fafc;
        }

        .cart-items {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            max-height: 50vh;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-title {
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: #64748b;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            background: #e2e8f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Warenkorb Summenbereich */
        .cart-footer {
            padding: 20px;
            border-top: 1px solid #eee;
            background: #f8fafc;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #475569;
        }

        .summary-total {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #cbd5e1;
        }

        .checkout-btn {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .checkout-btn:hover {
            background: #15803d;
        }

        .checkout-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="pos-container">
        <!-- Produktauswahl (Links/Oben) -->
        <section class="products-section">
            <h2>Produkte</h2>
            <div class="product-grid" id="productGrid">
                <!-- Produkte werden via JavaScript geladen -->
            </div>
        </section>

        <!-- Warenkorb (Rechts/Unten) -->
        <section class="cart-section">
            <div class="cart-header">
                <h2>Warenkorb</h2>
            </div>

            <div class="cart-items" id="cartItems">
                <p style="color: #94a3b8; text-align: center; margin-top: 20px;">Warenkorb ist leer</p>
            </div>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>Zwischensumme:</span>
                    <span id="subtotal">0,00 €</span>
                </div>
                <div class="summary-row">
                    <span>Inkl. 19% MwSt.:</span>
                    <span id="tax">0,00 €</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Gesamt:</span>
                    <span id="total">0,00 €</span>
                </div>

                <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>Kassieren</button>
            </div>
        </section>
    </div>

    <script>
        // Beispiel-Produkte
        const products = [
            { id: 1, name: "Kaffee", price: 2.90 },
            { id: 2, name: "Espresso", price: 2.20 },
            { id: 3, name: "Cappuccino", price: 3.50 },
            { id: 4, name: "Croissant", price: 1.80 },
            { id: 5, name: "Wasser 0,5l", price: 2.00 },
            { id: 6, name: "Cola 0,33l", price: 2.50 },
            { id: 7, name: "Kuchen", price: 3.90 },
            { id: 8, name: "Sandwich", price: 4.50 }
        ];

        let cart = [];

        // Produkte im Grid anzeigen
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(p.id);
                card.innerHTML = `
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toFixed(2).replace('.', ',')} €</div>
                `;
                grid.appendChild(card);
            });
        }

        // Produkt zum Warenkorb hinzufügen
        function addToCart(productId) {
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                const product = products.find(p => p.id === productId);
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        // Menge im Warenkorb ändern
        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCart();
        }

        // Warenkorb-Anzeige und Summen aktualisieren
        function updateCart() {
            const cartContainer = document.getElementById('cartItems');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #94a3b8; text-align: center; margin-top: 20px;">Warenkorb ist leer</p>';
                checkoutBtn.disabled = true;
                document.getElementById('subtotal').innerText = '0,00 €';
                document.getElementById('tax').innerText = '0,00 €';
                document.getElementById('total').innerText = '0,00 €';
                return;
            }

            checkoutBtn.disabled = false;
            cartContainer.innerHTML = '';

            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.name}</span>
                        <span class="cart-item-price">${item.quantity}x ${item.price.toFixed(2).replace('.', ',')} €</span>
                    </div>
                    <div class="cart-item-controls">
                        <button class="btn-qty" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="btn-qty" onclick="updateQuantity(${item.id}, 1)">+</button>
                    </div>
                `;
                cartContainer.appendChild(cartItem);
            });

            // MwSt. (19%) berechnen
            const tax = total - (total / 1.19);
            const subtotal = total - tax;

            document.getElementById('subtotal').innerText = subtotal.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('tax').innerText = tax.toFixed(2).replace('.', ',') + ' €';
            document.getElementById('total').innerText = total.toFixed(2).replace('.', ',') + ' €';
        }

        // Kassieren-Aktion
        function checkout() {
            const total = document.getElementById('total').innerText;
            alert(`Vielen Dank! Zu zahlender Betrag: ${total}`);
            cart = [];
            updateCart();
        }

        // Initialisierung
        renderProducts();
    </script>
</body>
</html>
