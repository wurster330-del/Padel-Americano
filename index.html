<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Padel Manager Pro - iPad Air Focus Edition</title>
  <style>
    :root {
      --bg: #0d0d0e;
      --card-bg: #1c1c1e;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #30d158;
      --accent-blue: #0a84ff;
      --accent-red: #ff453a;
      --accent-amber: #ffd60a;
      --accent-purple: #bf5af2;
      --text: #ffffff;
      --text-muted: #8e8e93;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      margin: 0 auto;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    h1 { 
      color: var(--accent); 
      margin: 0; 
      font-size: 22px; 
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ipad-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 767px) {
      body { height: auto; overflow: auto; }
      .ipad-layout { grid-template-columns: 1fr; }
    }

    /* Linke Spalte (Fixed Sticky Sidebar) */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .btn-group { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      background-color: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.active { 
      background-color: var(--accent-blue); 
      color: #fff; 
      border-color: var(--accent-blue);
    }
    button.action-btn { 
      background-color: #2c2c2e; 
    }
    button:active { transform: scale(0.98); }

    /* Focus Mode Toggle Banner */
    .focus-mode-bar {
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15), rgba(191, 90, 242, 0.15));
      border: 1px solid rgba(10, 132, 255, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .focus-mode-bar.active {
      background: linear-gradient(135deg, rgba(48, 209, 88, 0.2), rgba(10, 132, 255, 0.2));
      border-color: var(--accent);
    }
    .focus-status {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .focus-status .title { font-size: 13px; font-weight: 700; color: #fff; }
    .focus-status .subtitle { font-size: 11px; color: var(--text-muted); }

    .btn-focus-stop {
      background-color: var(--accent-red) !important;
      color: white !important;
      border: none !important;
      padding: 8px 12px !important;
      font-size: 12px !important;
      border-radius: 8px !important;
      font-weight: 700 !important;
      display: none;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Settings Bar */
    .settings-card {
      background-color: var(--card-bg);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .setting-tile {
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: #2c2c2e;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    /* Namenseditor & Auswahl */
    .edit-names-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .player-name-chip {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-name-chip.inactive { opacity: 0.35; }
    .player-name-chip .name-label {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      width: 100%;
    }
    .edit-icon { color: var(--text-muted); font-size: 11px; cursor: pointer; padding: 2px; }

    /* Leaderboard Table */
    .table-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      padding: 8px 10px;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { color: var(--text-muted); font-size: 10px; padding: 4px; border-bottom: 1px solid var(--card-border); text-transform: uppercase; }
    td { padding: 6px 4px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .rank { font-weight: 700; color: var(--accent-amber); width: 20px; }
    .stat-win { color: var(--accent); font-weight: 700; }
    .stat-loss { color: var(--accent-red); font-weight: 700; }

    /* Rechte Spalte (Scrollbarer Plan) */
    .main-content {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
      overflow-y: auto;
      padding-right: 6px;
      height: 100%;
      scroll-behavior: smooth;
    }

    /* CARD STYLING */
    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    /* FOCUS / ENLARGED STATE FOR CARDS */
    .card.focused-card {
      grid-column: 1 / -1; /* Nimmt volle Breite ein */
      background: linear-gradient(145deg, #1f232a, #16181d);
      border: 2px solid var(--accent-blue);
      box-shadow: 0 12px 32px rgba(10, 132, 255, 0.25);
      padding: 20px;
      margin: 8px 0;
      transform: scale(1.01);
      z-index: 10;
    }

    .card.focused-card .round-header {
      font-size: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card.focused-card .match-up {
      font-size: 18px;
      padding: 12px 0;
    }

    .card.focused-card .team {
      font-size: 18px;
    }

    .card.focused-card .pause {
      font-size: 13px;
      padding: 10px;
    }
    .card.focused-card .pause-names {
      font-size: 18px;
    }

    .card.focused-card .score-tile {
      padding: 16px 0;
      font-size: 26px;
      border-width: 2px;
      border-color: var(--accent-blue);
      background-color: rgba(10, 132, 255, 0.15);
    }

    .round-header {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-amber);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-badge {
      background: #2c2c2e;
      border: 1px solid var(--card-border);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .match-up {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 4px 0;
    }
    .team { font-weight: 600; width: 44%; text-align: center; line-height: 1.2; }
    .vs { color: var(--text-muted); font-size: 11px; font-weight: 800; }

    .pause {
      background-color: rgba(255, 159, 10, 0.1);
      border: 1px solid rgba(255, 159, 10, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: var(--accent-amber);
      text-align: center;
      font-weight: 600;
    }
    .pause-names {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
    }

    .score-inputs {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    .score-tile {
      flex: 1;
      background-color: #2c2c2e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 0;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }
    .score-tile.empty { color: var(--text-muted); font-size: 13px; font-weight: 500; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #1c1c1e;
      border-radius: 18px;
      padding: 22px;
      width: 90%;
      max-width: 440px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      text-align: center;
    }
    .number-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .num-btn {
      padding: 14px 0;
      background: #2c2c2e;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }
    .num-btn:active { background: var(--accent-blue); color: #fff; }

    .text-input-field {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #2c2c2e;
      color: #fff;
      margin-bottom: 16px;
      outline: none;
    }
    .text-input-field:focus { border-color: var(--accent-blue); }
  </style>
</head>
<body>

  <header>
    <h1>🎾 Padel Manager Pro <span style="font-size: 12px; background: rgba(48,209,88,0.15); color: var(--accent); padding: 2px 8px; border-radius: 6px;">Focus Mode</span></h1>
    <span style="font-size: 13px; color: var(--text-muted);">Ergebnisse & Live-Tabelle</span>
  </header>

  <div class="ipad-layout">
    
    <!-- Linke Spalte -->
    <div class="sidebar">
      <!-- Auto-Focus Bar -->
      <div id="focus-bar" class="focus-mode-bar">
        <div class="focus-status">
          <span class="title" id="focus-title-text">⚡ Auto-Fokus Aus</span>
          <span class="subtitle" id="focus-sub-text">Klicke Runde 1 für Auto-Weiterleitung</span>
        </div>
        <button id="btn-stop-focus" class="btn-focus-stop" onclick="stopFocusMode()">⏹ Stopp</button>
      </div>

      <div class="btn-group">
        <button id="btn6" class="active" onclick="setMode(6)">6 Spieler</button>
        <button id="btn5" onclick="setMode(5)">5 Spieler</button>
      </div>

      <div class="section-title">👥 Spieler-Auswahl</div>
      <div class="edit-names-list" id="names-editor-container"></div>

      <div class="settings-card">
        <div class="setting-item">
          <label>🎯 Zielpunkte:</label>
          <div id="global-target-tile" class="setting-tile" onclick="openGlobalTargetPicker()">31 Pkt</div>
        </div>
        <div class="setting-item">
          <label>☕ Bank-Punkte:</label>
          <div id="pause-points-tile" class="setting-tile" onclick="openPausePointsPicker()">0 Pkt</div>
        </div>
      </div>

      <button class="action-btn" onclick="shuffleActivePlayers()">🎲 Partner neu mischen</button>

      <div class="section-title">🏆 Live-Tabelle</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="rank">#</th>
              <th>Spieler</th>
              <th style="text-align: center;">Sp.</th>
              <th style="text-align: center;">S</th>
              <th style="text-align: center;">N</th>
              <th style="text-align: right;">Pkt</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <button class="action-btn" style="padding: 10px; margin-top: 2px; background-color: var(--accent-blue); color: #fff; font-weight: 700;" onclick="addExtraRound()">➕ Runde hinzufügen</button>
    </div>

    <!-- Rechte Spalte -->
    <div class="main-content">
      <div class="section-title" style="margin-bottom: 8px; display: flex; justify-content: space-between;">
        <span>📅 Spielplan</span>
        <span id="focus-indicator" style="color: var(--accent-blue); font-weight: 600; display: none;">Fokus aktiv</span>
      </div>
      <div class="plan-grid" id="plan-container"></div>
    </div>

  </div>

  <!-- Pop-up Overlay -->
  <div id="picker-modal" class="modal-overlay" onclick="closePicker(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div id="modal-title" class="modal-header">Punkte wählen</div>
      <div id="modal-body-container">
        <div id="number-grid" class="number-grid"></div>
      </div>
      <div id="modal-footer" style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="action-btn" style="padding: 12px; flex: 1;" onclick="closePicker()">Abbrechen</button>
      </div>
    </div>
  </div>

  <script>
    let allMasterPlayers = ["Werner", "Marco", "Tobias", "Christian", "David", "Stefan"];
    let selected5Players = ["Werner", "Marco", "Tobias", "Christian", "David"];
    let activePlayers = [...allMasterPlayers];
    
    let mode = 6;
    let totalRounds = 15;
    let globalTargetPoints = 31;
    let pausePoints = 0;

    let focusedRound = null; // Aktuell vergrößerte Runde
    let isFocusModeActive = false; // Modus aktiv?

    let currentActiveRound = null;
    let currentActiveTeam = null;
    let editingPlayerIndex = null;

    const matchScores = {};

    const basePlan5 = [
      { p1: [0, 1], p2: [2, 3], pause: [4] },
      { p1: [1, 2], p2: [3, 4], pause: [0] },
      { p1: [2, 3], p2: [4, 0], pause: [1] },
      { p1: [3, 4], p2: [0, 1], pause: [2] },
      { p1: [4, 0], p2: [1, 2], pause: [3] }
    ];

    const basePlan6 = [
      { p1: [0, 1], p2: [2, 3], pause: [4, 5] },
      { p1: [2, 4], p2: [3, 5], pause: [0, 1] },
      { p1: [0, 5], p2: [1, 4], pause: [2, 3] },
      { p1: [1, 3], p2: [0, 2], pause: [4, 5] },
      { p1: [4, 5], p2: [2, 3], pause: [0, 1] },
      { p1: [0, 1], p2: [4, 5], pause: [2, 3] },
      { p1: [2, 5], p2: [1, 3], pause: [0, 4] },
      { p1: [0, 4], p2: [2, 3], pause: [1, 5] },
      { p1: [1, 5], p2: [0, 2], pause: [3, 4] },
      { p1: [3, 4], p2: [1, 5], pause: [0, 2] },
      { p1: [0, 2], p2: [4, 5], pause: [1, 3] },
      { p1: [1, 3], p2: [0, 4], pause: [2, 5] },
      { p1: [2, 5], p2: [1, 4], pause: [0, 3] },
      { p1: [0, 3], p2: [2, 5], pause: [1, 4] },
      { p1: [1, 4], p2: [0, 5], pause: [2, 3] }
    ];

    function renderNamesEditor() {
      const container = document.getElementById('names-editor-container');
      container.innerHTML = '';
      
      allMasterPlayers.forEach((name, index) => {
        const isSelected = selected5Players.includes(name);
        const chip = document.createElement('div');
        chip.className = `player-name-chip ${mode === 5 && !isSelected ? 'inactive' : ''}`;
        
        let checkboxHTML = '';
        if (mode === 5) {
          checkboxHTML = `<input type="checkbox" ${isSelected ? 'checked' : ''} onchange="togglePlayerSelection('${name}')">`;
        }

        chip.innerHTML = `
          <div class="name-label" onclick="${mode === 5 ? `togglePlayerSelection('${name}')` : ''}">
            ${checkboxHTML}
            <span>${name}</span>
          </div>
          <span class="edit-icon" onclick="openRenameModal(${index})">✏️</span>
        `;
        container.appendChild(chip);
      });
    }

    function togglePlayerSelection(name) {
      if (mode !== 5) return;

      if (selected5Players.includes(name)) {
        if (selected5Players.length > 1) {
          selected5Players = selected5Players.filter(p => p !== name);
        }
      } else {
        if (selected5Players.length < 5) {
          selected5Players.push(name);
        } else {
          alert("Es sind bereits 5 Spieler ausgewählt!");
        }
      }

      activePlayers = [...selected5Players];
      renderNamesEditor();
      renderPlan();
      calculateStats();
    }

    function openRenameModal(index) {
      editingPlayerIndex = index;
      const currentName = allMasterPlayers[index];

      document.getElementById('modal-title').innerText = `Name von Spieler ${index + 1} ändern`;
      const bodyContainer = document.getElementById('modal-body-container');
      
      bodyContainer.innerHTML = `
        <input type="text" id="player-name-input" class="text-input-field" value="${currentName}" autofocus placeholder="Neuer Name...">
      `;

      const footer = document.getElementById('modal-footer');
      footer.innerHTML = `
        <button class="action-btn" style="padding: 12px; flex: 1;" onclick="closePicker()">Abbrechen</button>
        <button class="action-btn" style="padding: 12px; flex: 1; background-color: var(--accent); color: #000; font-weight: 700;" onclick="savePlayerName()">Speichern</button>
      `;

      document.getElementById('picker-modal').classList.add('open');

      setTimeout(() => {
        const inputField = document.getElementById('player-name-input');
        if (inputField) {
          inputField.focus();
          inputField.select();
        }
      }, 100);
    }

    function savePlayerName() {
      const inputField = document.getElementById('player-name-input');
      if (inputField) {
        const newName = inputField.value.trim();
        if (newName !== "") {
          const oldName = allMasterPlayers[editingPlayerIndex];
          allMasterPlayers[editingPlayerIndex] = newName;

          const selIdx = selected5Players.indexOf(oldName);
          if (selIdx !== -1) {
            selected5Players[selIdx] = newName;
          }

          if (mode === 6) {
            activePlayers = [...allMasterPlayers];
          } else {
            activePlayers = [...selected5Players];
          }

          renderNamesEditor();
          renderPlan();
          calculateStats();
        }
      }
      closePicker();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btn6').classList.toggle('active', mode === 6);
      document.getElementById('btn5').classList.toggle('active', mode === 5);

      if (mode === 6) {
        activePlayers = [...allMasterPlayers];
      } else {
        activePlayers = [...selected5Players];
      }
      totalRounds = 15;

      renderNamesEditor();
      renderPlan();
      calculateStats();
    }

    function shuffleActivePlayers() {
      if (mode === 5 && activePlayers.length !== 5) {
        alert("Bitte genau 5 Spieler auswählen!");
        return;
      }
      for (let i = activePlayers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activePlayers[i], activePlayers[j]] = [activePlayers[j], activePlayers[i]];
      }
      renderPlan();
      calculateStats();
    }

    function getRoundTarget(roundNum) {
      const scoreObj = matchScores[roundNum];
      if (scoreObj && scoreObj.customTarget !== undefined) {
        return scoreObj.customTarget;
      }
      return globalTargetPoints;
    }

    function openGlobalTargetPicker() {
      document.getElementById('modal-title').innerText = "Standard Zielpunkte wählen";
      resetModalBody();
      
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      for (let i = 15; i <= 40; i++) {
        const btn = document.createElement('div');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => {
          globalTargetPoints = i;
          document.getElementById('global-target-tile').innerText = `${globalTargetPoints} Pkt`;
          renderPlan();
          closePicker();
          calculateStats();
        };
        grid.appendChild(btn);
      }

      document.getElementById('picker-modal').classList.add('open');
    }

    function openPausePointsPicker() {
      document.getElementById('modal-title').innerText = "Bank-Punkte wählen";
      resetModalBody();
      
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      for (let i = 0; i <= 20; i++) {
        const btn = document.createElement('div');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => {
          pausePoints = i;
          document.getElementById('pause-points-tile').innerText = `${pausePoints} Pkt`;
          closePicker();
          calculateStats();
        };
        grid.appendChild(btn);
      }

      document.getElementById('picker-modal').classList.add('open');
    }

    /* FOCUS MODE LOGIC */
    function startFocusOnRound(roundNum) {
      focusedRound = roundNum;
      isFocusModeActive = true;
      updateFocusUI();
      renderPlan();

      // Automatisches sanftes Scrollen zur vergrößerten Karte
      setTimeout(() => {
        const cardElem = document.getElementById(`round-card-${roundNum}`);
        if (cardElem) {
          cardElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 50);
    }

    function stopFocusMode() {
      focusedRound = null;
      isFocusModeActive = false;
      updateFocusUI();
      renderPlan();
    }

    function updateFocusUI() {
      const focusBar = document.getElementById('focus-bar');
      const focusTitle = document.getElementById('focus-title-text');
      const focusSub = document.getElementById('focus-sub-text');
      const stopBtn = document.getElementById('btn-stop-focus');
      const focusIndicator = document.getElementById('focus-indicator');

      if (isFocusModeActive && focusedRound !== null) {
        focusBar.classList.add('active');
        focusTitle.innerText = `⚡ Auto-Fokus: Runde ${focusedRound}`;
        focusSub.innerText = "Nahtloser Ablauf aktiviert";
        stopBtn.style.display = 'block';
        focusIndicator.style.display = 'inline';
      } else {
        focusBar.classList.remove('active');
        focusTitle.innerText = "⚡ Auto-Fokus Aus";
        focusSub.innerText = "Klicke eine Runde zum Starten";
        stopBtn.style.display = 'none';
        focusIndicator.style.display = 'none';
      }
    }

    function openScorePicker(roundNum, team) {
      if (mode === 5 && activePlayers.length !== 5) {
        alert("Bitte genau 5 Spieler auswählen!");
        return;
      }

      // Auto-Start des Fokus-Modus beim Tippen auf eine Zahl
      if (!isFocusModeActive) {
        startFocusOnRound(roundNum);
      } else {
        focusedRound = roundNum;
      }

      currentActiveRound = roundNum;
      currentActiveTeam = team;

      const maxPoints = getRoundTarget(roundNum);
      document.getElementById('modal-title').innerText = `Runde ${roundNum}: Punkte T${team} wählen`;
      resetModalBody();
      
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      for (let i = 0; i <= maxPoints; i++) {
        const btn = document.createElement('div');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => selectScoreValue(i, maxPoints);
        grid.appendChild(btn);
      }

      document.getElementById('picker-modal').classList.add('open');
    }

    function openTargetPicker(roundNum) {
      currentActiveRound = roundNum;

      document.getElementById('modal-title').innerText = `Runde ${roundNum}: Neue Zielpunkte`;
      resetModalBody();
      
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';

      for (let i = 15; i <= 40; i++) {
        const btn = document.createElement('div');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => selectRoundTargetValue(i);
        grid.appendChild(btn);
      }

      document.getElementById('picker-modal').classList.add('open');
    }

    function resetModalBody() {
      const bodyContainer = document.getElementById('modal-body-container');
      bodyContainer.innerHTML = '<div id="number-grid" class="number-grid"></div>';
      
      const footer = document.getElementById('modal-footer');
      footer.innerHTML = '<button class="action-btn" style="width: 100%; padding: 12px; flex: 1;" onclick="closePicker()">Abbrechen</button>';
    }

    function closePicker() {
      document.getElementById('picker-modal').classList.remove('open');
    }

    function selectScoreValue(val, maxPoints) {
      if (!matchScores[currentActiveRound]) matchScores[currentActiveRound] = {};

      if (currentActiveTeam === 1) {
        matchScores[currentActiveRound].t1 = val;
        matchScores[currentActiveRound].t2 = maxPoints - val;
      } else {
        matchScores[currentActiveRound].t2 = val;
        matchScores[currentActiveRound].t1 = maxPoints - val;
      }

      closePicker();
      calculateStats();

      // AUTO-WEITERLEITUNG ZUR NÄCHSTEN RUNDE
      if (isFocusModeActive) {
        if (currentActiveRound < totalRounds) {
          startFocusOnRound(currentActiveRound + 1);
        } else {
          alert("🎉 Alle Runden abgeschlossen!");
          stopFocusMode();
        }
      } else {
        renderPlan();
      }
    }

    function selectRoundTargetValue(newTarget) {
      if (!matchScores[currentActiveRound]) matchScores[currentActiveRound] = {};
      
      matchScores[currentActiveRound].customTarget = newTarget;

      delete matchScores[currentActiveRound].t1;
      delete matchScores[currentActiveRound].t2;

      renderPlan();
      closePicker();
      calculateStats();
    }

    function renderPlan() {
      const container = document.getElementById('plan-container');
      container.innerHTML = '';

      if (mode === 5 && activePlayers.length !== 5) {
        container.innerHTML = `<div style="padding: 20px; color: var(--accent-red); font-weight: bold; text-align: center;">Bitte genau 5 Spieler auswählen!</div>`;
        return;
      }

      const basePlan = mode === 5 ? basePlan5 : basePlan6;

      for (let i = 0; i < totalRounds; i++) {
        const item = basePlan[i % basePlan.length];
        const roundNum = i + 1;

        const team1 = item.p1.map(idx => activePlayers[idx]).join(' & ');
        const team2 = item.p2.map(idx => activePlayers[idx]).join(' & ');
        const pause = item.pause.map(idx => activePlayers[idx]).join(' & ');

        const scoreObj = matchScores[roundNum] || {};
        const targetVal = getRoundTarget(roundNum);

        const t1Val = scoreObj.t1 !== undefined ? scoreObj.t1 : 'T1 Pkt';
        const t2Val = scoreObj.t2 !== undefined ? scoreObj.t2 : 'T2 Pkt';

        const isFocused = isFocusModeActive && (focusedRound === roundNum);

        const card = document.createElement('div');
        card.id = `round-card-${roundNum}`;
        card.className = `card ${isFocused ? 'focused-card' : ''}`;
        
        card.innerHTML = `
          <div class="round-header">
            <span>Runde ${roundNum} ${isFocused ? '🔍 (Fokus)' : ''}</span>
            <div class="target-badge" onclick="openTargetPicker(${roundNum})">
              Ziel: ${targetVal} ✏️
            </div>
          </div>
          <div class="match-up">
            <span class="team">${team1}</span>
            <span class="vs">VS</span>
            <span class="team">${team2}</span>
          </div>
          
          <div class="pause">
            ☕ PAUSE
            <span class="pause-names">${pause}</span>
          </div>

          <div class="score-inputs">
            <div class="score-tile ${scoreObj.t1 === undefined ? 'empty' : ''}" onclick="openScorePicker(${roundNum}, 1)">${t1Val}</div>
            <span style="color:var(--text-muted); font-weight:bold;">:</span>
            <div class="score-tile ${scoreObj.t2 === undefined ? 'empty' : ''}" onclick="openScorePicker(${roundNum}, 2)">${t2Val}</div>
          </div>
        `;

        // Bei Klick auf die Karte Fokus aktivieren
        card.onclick = (e) => {
          if (!e.target.closest('.score-tile') && !e.target.closest('.target-badge')) {
            startFocusOnRound(roundNum);
          }
        };

        container.appendChild(card);
      }
    }

    function addExtraRound() {
      totalRounds++;
      renderPlan();
      calculateStats();
    }

    function calculateStats() {
      const stats = {};
      
      activePlayers.forEach(pName => {
        stats[pName] = { points: 0, matches: 0, wins: 0, losses: 0 };
      });

      if (mode === 5 && activePlayers.length !== 5) {
        updateLeaderboard(null);
        return;
      }

      const basePlan = mode === 5 ? basePlan5 : basePlan6;

      for (let i = 0; i < totalRounds; i++) {
        const roundNum = i + 1;
        const item = basePlan[i % basePlan.length];
        const scoreObj = matchScores[roundNum];

        if (scoreObj && scoreObj.t1 !== undefined && scoreObj.t2 !== undefined) {
          const s1 = scoreObj.t1;
          const s2 = scoreObj.t2;

          item.p1.forEach(idx => {
            const name = activePlayers[idx];
            if(stats[name]) { 
              stats[name].points += s1; 
              stats[name].matches += 1; 
              if (s1 > s2) stats[name].wins += 1;
              else if (s1 < s2) stats[name].losses += 1;
            }
          });

          item.p2.forEach(idx => {
            const name = activePlayers[idx];
            if(stats[name]) { 
              stats[name].points += s2; 
              stats[name].matches += 1; 
              if (s2 > s1) stats[name].losses += 1;
              else if (s2 < s1) stats[name].losses += 1;
            }
          });

          if (pausePoints > 0) {
            item.pause.forEach(idx => {
              const name = activePlayers[idx];
              if(stats[name]) { stats[name].points += pausePoints; }
            });
          }
        }
      }

      updateLeaderboard(stats);
    }

    function updateLeaderboard(stats = null) {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';

      if (!stats) {
        stats = {};
        activePlayers.forEach(pName => {
          stats[pName] = { points: 0, matches: 0, wins: 0, losses: 0 };
        });
      }

      const sorted = Object.keys(stats).map(name => ({
        name: name,
        points: stats[name].points,
        matches: stats[name].matches,
        wins: stats[name].wins,
        losses: stats[name].losses
      })).sort((a, b) => b.points - a.points || b.wins - a.wins);

      sorted.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td style="font-weight: 600;">${item.name}</td>
          <td style="text-align: center; color: var(--text-muted);">${item.matches}</td>
          <td style="text-align: center;" class="stat-win">${item.wins}</td>
          <td style="text-align: center;" class="stat-loss">${item.losses}</td>
          <td style="text-align: right; font-weight: 800; color: var(--accent);">${item.points}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    setMode(6);
  </script>
</body>
</html>
